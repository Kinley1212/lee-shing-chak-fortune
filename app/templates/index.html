<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>李丞責博士 · AI玄學問答</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf7f3;--card:#fff;--card2:#f5f0ea;
  --red:#990f23;--red2:#c41429;--red3:#7a0a1b;
  --gold:#b8860b;--gold2:#d4a820;--gold3:#8b6510;
  --border:rgba(153,15,35,.15);--text:#1a0808;--text2:#4a2828;--text3:#9a7070;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"PingFang TC","Hiragino Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(ellipse 48% 60% at 0% 40%,rgba(153,15,35,.06),transparent 70%),radial-gradient(ellipse 40% 50% at 100% 12%,rgba(184,134,11,.07),transparent 65%),var(--bg)}
#app{width:min(900px,100%);height:100dvh;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:rgba(250,247,243,.82);border-left:1px solid var(--border);border-right:1px solid var(--border);box-shadow:0 0 55px rgba(153,15,35,.07)}
#header{min-height:78px;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;background:rgba(255,255,255,.94);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);z-index:10}
.back-link{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--red);text-decoration:none;border:1px solid var(--border);background:var(--bg);font-size:1.1rem;transition:background .2s,border-color .2s}
.back-link:hover{background:#fff3f4;border-color:rgba(153,15,35,.35)}
.header-avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:center 18%;border:2px solid rgba(184,134,11,.62);box-shadow:0 4px 14px rgba(153,15,35,.12)}
.header-info{min-width:0;flex:1}.header-name{font-size:1rem;font-weight:700;color:var(--red3);letter-spacing:.6px}
.header-status{font-size:.72rem;color:var(--text3);display:flex;align-items:center;gap:6px;margin-top:4px}
.status-dot{width:7px;height:7px;border-radius:50%;background:#279348;box-shadow:0 0 0 3px rgba(39,147,72,.1)}
.report-link{padding:9px 14px;border-radius:999px;text-decoration:none;color:var(--gold3);font-size:.76rem;font-weight:700;border:1px solid rgba(184,134,11,.28);background:rgba(184,134,11,.06)}
#chat{flex:1;overflow-y:auto;padding:24px clamp(14px,4vw,34px) 18px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
#chat::-webkit-scrollbar{width:5px}#chat::-webkit-scrollbar-thumb{background:rgba(153,15,35,.16);border-radius:99px}
.scope-note{align-self:center;max-width:620px;text-align:center;color:var(--text3);font-size:.7rem;line-height:1.6;padding:7px 13px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.7)}
.memory-card{align-self:center;max-width:660px;width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid rgba(184,134,11,.25);border-radius:10px;background:rgba(184,134,11,.055);color:var(--gold3);font-size:.7rem;line-height:1.45}
.memory-card[hidden]{display:none}.memory-icon{font-size:.9rem}.memory-text{flex:1;min-width:0}
.memory-title{font-weight:700;margin-right:5px}.memory-clear{border:0;background:transparent;color:var(--red);font:inherit;font-weight:700;cursor:pointer;white-space:nowrap;padding:4px 2px}
.row{display:flex;gap:9px;max-width:min(82%,680px);animation:fadeUp .22s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.row.ai{align-self:flex-start}.row.user{align-self:flex-end;flex-direction:row-reverse}
.row-avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700}
.row.ai .row-avatar{object-fit:cover;object-position:center 18%;border:1px solid rgba(184,134,11,.5);background:#fff}
.row.user .row-avatar{color:#fff;background:linear-gradient(135deg,var(--red3),var(--red))}
.message-col{display:flex;flex-direction:column;gap:4px;min-width:0}
.bubble{padding:12px 15px;font-size:.875rem;line-height:1.75;word-break:break-word;white-space:pre-wrap}
.row.ai .bubble{color:var(--text2);background:var(--card);border:1px solid var(--border);border-radius:5px 15px 15px 15px;box-shadow:0 4px 16px rgba(153,15,35,.045)}
.row.user .bubble{color:#fff;background:linear-gradient(135deg,var(--red3),var(--red));border-radius:15px 5px 15px 15px;box-shadow:0 5px 16px rgba(153,15,35,.13)}
.timestamp{padding:0 5px;color:var(--text3);font-size:.64rem}.row.user .timestamp{text-align:right}
.citations{padding:9px 11px;border-left:3px solid var(--gold);border-radius:6px;background:rgba(184,134,11,.065);color:var(--gold3);font-size:.7rem;line-height:1.55}
.citations-title{font-weight:700;margin-bottom:4px}.citation-item+.citation-item{margin-top:3px}
.dots{display:inline-flex;gap:5px;padding:4px 1px}.dots span{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:blink .9s infinite;opacity:.25}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.22;transform:scale(.82)}40%{opacity:1;transform:scale(1)}}
#composer{flex-shrink:0;padding:12px clamp(14px,4vw,28px) 16px;background:rgba(255,255,255,.95);border-top:1px solid var(--border);backdrop-filter:blur(12px)}
.input-row{display:flex;align-items:flex-end;gap:10px;max-width:760px;margin:0 auto;padding:7px 7px 7px 15px;border:1px solid rgba(153,15,35,.22);border-radius:18px;background:#fff;box-shadow:0 5px 20px rgba(153,15,35,.06)}
#txt{flex:1;min-height:40px;max-height:130px;padding:9px 0;border:none;outline:none;resize:none;color:var(--text);font:inherit;font-size:.875rem;line-height:1.5;background:transparent}
#txt::placeholder{color:var(--text3)}
#sbtn{width:42px;height:42px;border:0;border-radius:50%;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold3),var(--gold));color:#fff;font-size:1rem;transition:opacity .2s,transform .1s}
#sbtn:hover{opacity:.88}#sbtn:active{transform:scale(.94)}#sbtn:disabled{opacity:.38;cursor:not-allowed}
.composer-note{text-align:center;color:var(--text3);font-size:.65rem;margin-top:7px}
@media(max-width:600px){
  #app{border:0}.report-link{display:none}#header{padding:9px 12px;min-height:72px}
  .header-avatar{width:46px;height:46px}.row{max-width:91%}#chat{padding-top:18px}.scope-note{border-radius:10px}
}
</style>
</head>
<body>
<main id="app">
  <header id="header">
    <a class="back-link" href="/" aria-label="返回運勢報告">‹</a>
    <img class="header-avatar" src="/static/portrait.png" alt="李丞責博士"/>
    <div class="header-info">
      <div class="header-name">李丞責博士 · AI玄學問答</div>
      <div class="header-status"><span class="status-dot"></span>依據書本知識庫回答</div>
    </div>
    <a class="report-link" href="/">返回運勢報告</a>
  </header>
  <section id="chat" aria-live="polite">
    <div class="scope-note">開始前請先輸入生肖或完整出生日期，例如：屬牛，或1990年5月20日</div>
    <div class="memory-card" id="memory-card" hidden>
      <span class="memory-icon">✦</span>
      <div class="memory-text"><span class="memory-title">本次會話記憶</span><span id="memory-values"></span></div>
      <button class="memory-clear" id="memory-clear" type="button">清除記憶</button>
    </div>
  </section>
  <footer id="composer">
    <div class="input-row">
      <textarea id="txt" rows="1" placeholder="例如：1990年5月20日出生，想問今年事業" aria-label="輸入問題"></textarea>
      <button id="sbtn" type="button" aria-label="發送訊息">➤</button>
    </div>
    <div class="composer-note">回答依據現有知識庫，玄學內容僅供參考</div>
  </footer>
</main>
<script>
const chatEl=document.getElementById("chat"),txtEl=document.getElementById("txt"),sbtnEl=document.getElementById("sbtn");
const memoryCard=document.getElementById("memory-card"),memoryValues=document.getElementById("memory-values"),memoryClear=document.getElementById("memory-clear");
let history=[];
function now(){return new Date().toLocaleTimeString("zh-HK",{hour:"2-digit",minute:"2-digit"})}
function scrollBottom(){chatEl.scrollTop=chatEl.scrollHeight}
function plainText(value){return String(value||"").replace(/\*\*/g,"").replace(/__/g,"").replace(/\x60{1,3}/g,"").replace(/^\s{0,3}#{1,6}\s*/gm,"").replace(/^\s*[-*+]\s+/gm,"• ").replace(/^\s*>\s?/gm,"").replace(/~~|\*/g,"").replace(/\n{3,}/g,"\n\n").trim()}
function avatar(isUser){
  if(isUser){const el=document.createElement("div");el.className="row-avatar";el.textContent="你";return el}
  const img=document.createElement("img");img.className="row-avatar";img.src="/static/portrait.png";img.alt="李丞責博士";return img
}
function addBubble(text,isUser,citations=[]){
  const row=document.createElement("div");row.className="row "+(isUser?"user":"ai");
  const col=document.createElement("div");col.className="message-col";
  const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=plainText(text);col.appendChild(bubble);
  if(!isUser&&citations.length){
    const box=document.createElement("div");box.className="citations";
    const title=document.createElement("div");title.className="citations-title";title.textContent="資料依據";box.appendChild(title);
    [...new Set(citations.map(item=>item.source||"知識庫"))].forEach(source=>{
      const line=document.createElement("div");line.className="citation-item";line.textContent=source;box.appendChild(line)
    });col.appendChild(box)
  }
  const ts=document.createElement("div");ts.className="timestamp";ts.textContent=now();col.appendChild(ts);
  row.appendChild(avatar(isUser));row.appendChild(col);chatEl.appendChild(row);scrollBottom()
}
function showLoading(){
  const row=document.createElement("div");row.className="row ai";row.id="loading-row";
  const col=document.createElement("div");col.className="message-col";const bubble=document.createElement("div");bubble.className="bubble";
  bubble.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  col.appendChild(bubble);row.appendChild(avatar(false));row.appendChild(col);chatEl.appendChild(row);scrollBottom()
}
function removeLoading(){document.getElementById("loading-row")?.remove()}
function resizeInput(){txtEl.style.height="auto";txtEl.style.height=Math.min(txtEl.scrollHeight,130)+"px"}
function renderProfile(profile={}){
  const parts=[];
  if(profile.birth_date)parts.push("出生日期 "+profile.birth_date);
  if(profile.zodiac)parts.push("屬"+profile.zodiac);
  if(profile.gender)parts.push(profile.gender);
  if((profile.topics||[]).length)parts.push("關注 "+profile.topics.slice(-3).join("、"));
  memoryValues.textContent=parts.join(" · ");memoryCard.hidden=!parts.length
}
async function loadProfile(){
  try{const res=await fetch("/chat/profile");const data=await res.json();if(res.ok)renderProfile(data.profile)}catch(error){console.error("讀取會話記憶失敗",error)}
}
async function clearProfile(){
  memoryClear.disabled=true;
  try{
    const res=await fetch("/chat/profile",{method:"DELETE"});const data=await res.json();
    if(!res.ok)throw new Error(data.error||"清除失敗");
    history=[];renderProfile(data.profile);addBubble("本次會話記憶已清除。下次提問時，請重新提供生肖或完整出生日期。",false)
  }catch(error){addBubble("暫時無法清除會話記憶，請稍後再試。",false)}
  finally{memoryClear.disabled=false}
}
async function sendMsg(){
  const text=txtEl.value.trim();if(!text||sbtnEl.disabled)return;
  const priorHistory=history.slice(-10);txtEl.value="";resizeInput();sbtnEl.disabled=true;
  addBubble(text,true);history.push({role:"user",content:text});if(history.length>20)history=history.slice(-20);showLoading();
  try{
    const res=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,history:priorHistory})});
    const data=await res.json();removeLoading();if(data.profile)renderProfile(data.profile);
    if(!res.ok||data.error){addBubble("暫時無法完成回答："+(data.error||"請稍後再試。"),false)}
    else{const reply=plainText(data.reply);addBubble(reply,false,data.citations||[]);history.push({role:"model",content:reply});if(history.length>20)history=history.slice(-20)}
  }catch(error){removeLoading();addBubble("網絡連線出現問題，請稍後再試。",false)}
  finally{sbtnEl.disabled=false;txtEl.focus()}
}
txtEl.addEventListener("input",resizeInput);
txtEl.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();sendMsg()}});
sbtnEl.addEventListener("click",sendMsg);
memoryClear.addEventListener("click",clearProfile);
addBubble("您好，我是李丞責博士的AI玄學問答助手。開始前，請先告訴我你的生肖或完整出生日期，再說明想了解的主題；我會根據現有書本資料回答。",false);
loadProfile();
</script>
</body>
</html>
